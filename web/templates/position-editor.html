<dialog id="salePlanner" aria-labelledby="salePlannerTitle">
  <form id="salePlannerForm">
    <div class="sectionhead">
      <h2 id="salePlannerTitle">Plan a sale</h2>
      <button type="button" id="closeSalePlanner">Close</button>
    </div>
    <p id="salePlannerPolicy"></p>
    <p id="salePlannerQuote"></p>
    <div class="grid">
      <label>Sale goal<select name="goal">
        <option value="trim">Reduce my position</option>
        <option value="cash">Raise cash</option>
        <option value="exit">Exit the position</option>
      </select></label>
      <label>Timing<select name="timing">
        <option value="soon">Sell soon</option>
        <option value="limit">Wait for a higher price</option>
      </select></label>
      <div id="saleTrimFields">
        <label>Target portfolio weight (%)<input name="target" type="number" min="0" max="100" step="any" /></label>
      </div>
      <div id="saleCashFields" hidden>
        <label>Cash goal after fees (<span id="saleCashCurrency"></span>)<input name="cash" type="number" min="0" step="any" /></label>
      </div>
      <div id="saleLimitFields" hidden>
        <label>Limit price per share (<span id="saleLimitCurrency"></span>)<input name="limit" type="number" min="0" step="any" /></label>
      </div>
    </div>
    <p id="salePlannerResult" role="status"></p>
    <p class="muted">Estimates exclude taxes. Place any order separately with your broker.</p>
  </form>
</dialog>
<dialog id="editor">
  <form id="positionForm">
    <div class="sectionhead">
      <h2>Company notebook</h2>
      <button type="button" id="close">Close</button>
    </div>
    <div class="grid">
      <label
        >Ticker<input
          name="symbol"
          required
          placeholder="NORBT or BOUV.OL"
          maxlength="20" /></label
      ><label
        >Trading currency<select name="currency">
          <option>NOK</option>
          <option>USD</option>
        </select></label
      ><label
        >Shares (0 = watchlist)<input
          name="shares"
          type="number"
          min="0"
          step="any"
          value="0"
          required /></label
      ><label
        >Average cost per share<input
          name="cost"
          type="number"
          min="0"
          step="any"
          value="0"
          required /></label
      ><label>Review below price<input name="below" type="number" min="0" step="any" /></label
      ><label>Review above price<input name="above" type="number" min="0" step="any" /></label>
    </div>
    <label class="check"><input name="long_term" type="checkbox" /> Long-term holding · keep reviewing significant risks</label>
    <label
      >Why I own / follow this company<textarea
        name="thesis"
        placeholder="Business strengths, valuation assumptions, expected holding period…"
      ></textarea></label
    ><label
      >What would make me reconsider?<textarea
        name="review"
        placeholder="Debt, margins, competition, management, growth…"
      ></textarea>
    </label>
    <p id="formError" role="alert"></p>
    <button type="submit">Save company</button>
  </form>
</dialog>
