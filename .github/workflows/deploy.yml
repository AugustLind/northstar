name: Deploy Northstar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: northstar-production
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/checks.yml
  oracle:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare verified SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$ORACLE_HOST" || { echo 'Configure ORACLE_SSH_KEY, ORACLE_KNOWN_HOSTS and ORACLE_HOST first.'; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/northstar_deploy
          chmod 600 ~/.ssh/northstar_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload tracked source and deploy Oracle
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
        run: |
          git archive --format=tar.gz HEAD > /tmp/northstar-deploy.tar.gz
          scp -i ~/.ssh/northstar_deploy -o StrictHostKeyChecking=yes /tmp/northstar-deploy.tar.gz "ubuntu@$ORACLE_HOST:northstar-deploy.tar.gz"
          ssh -i ~/.ssh/northstar_deploy -o StrictHostKeyChecking=yes "ubuntu@$ORACLE_HOST" 'tar -xOf ~/northstar-deploy.tar.gz scripts/deploy-oracle.sh > ~/northstar-deploy.sh && bash ~/northstar-deploy.sh ~/northstar-deploy.tar.gz'
      - name: Check public annual financial-data coverage on Oracle
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
        run: ssh -i ~/.ssh/northstar_deploy -o StrictHostKeyChecking=yes "ubuntu@$ORACLE_HOST" 'cd ~/northstar && python3 scripts/probe-financials.py'
      - name: Check public NewsWeb announcement coverage on Oracle
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
        run: ssh -i ~/.ssh/northstar_deploy -o StrictHostKeyChecking=yes "ubuntu@$ORACLE_HOST" 'cd ~/northstar && python3 scripts/probe-announcements.py'
      - name: Check public company metadata and Oslo benchmark coverage
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
        run: ssh -i ~/.ssh/northstar_deploy -o StrictHostKeyChecking=yes "ubuntu@$ORACLE_HOST" 'cd ~/northstar && python3 scripts/probe-company-data.py'
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/northstar_deploy
  pages:
    needs: oracle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Prevent default Pages publisher from overwriting the dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/wait-for-default-pages.py
      - name: Build public dashboard
        env:
          NORTHSTAR_API_URL: ${{ vars.NORTHSTAR_API_URL }}
        run: python scripts/build-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-dist
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  verify:
    needs: [oracle, pages]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      ORACLE_HOST: ${{ vars.ORACLE_HOST }}
      API_ORIGIN: ${{ vars.NORTHSTAR_API_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare verification
        id: prepare
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p verification
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/northstar_verify
          chmod 600 ~/.ssh/northstar_verify
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Verify private API and every public dashboard asset
        id: contracts
        run: |
          printf '%s\n' "$API_ORIGIN" |
            timeout 180s ssh -i ~/.ssh/northstar_verify -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "ubuntu@$ORACLE_HOST" \
              'cd ~/northstar && python3 -u scripts/smoke-deployment.py --origin-stdin --page-url https://augustlind.github.io/northstar/ --attempts 10' |
            tee verification/release-checks.txt
      - name: Collect release verification evidence
        if: failure()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
        run: |
          mkdir -p verification
          python3 - <<'PY' > verification/run.json
          import json
          import os
          print(json.dumps({
              "release": os.environ["GITHUB_SHA"],
              "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "steps": {step.lower(): os.environ[step] for step in ("PREPARE", "CONTRACTS")},
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/
          retention-days: 7
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/northstar_verify
